name: Populate AI Plus Bitable Content

on:
  workflow_dispatch:

jobs:
  populate:
    runs-on: ubuntu-latest
    env:
      LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Populate AI++ Bitable sync tables
        run: python scripts/populate_ai_plus_bitable_content.py
