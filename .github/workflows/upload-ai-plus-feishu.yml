name: Upload AI Plus Pages to Feishu

on:
  workflow_dispatch:
    inputs:
      folder_token:
        description: "Target Feishu folder token"
        required: true
        default: "EEltfv9ajl5COodQipLcZPPdnnf"

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create AI++ Feishu docs and bitables
        run: |
          python scripts/upload_ai_plus_to_feishu.py \
            --folder-token "${{ inputs.folder_token }}" \
            --repo-root "$GITHUB_WORKSPACE"
