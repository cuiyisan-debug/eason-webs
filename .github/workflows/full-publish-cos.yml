name: Full Publish to Tencent COS

on:
  workflow_dispatch:
    inputs:
      refresh_feishu_first:
        description: "Refresh Feishu data before mirroring media"
        required: true
        default: true
        type: boolean

jobs:
  full-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests cos-python-sdk-v5

      - name: Refresh portfolio data from Feishu
        if: ${{ inputs.refresh_feishu_first }}
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ secrets.LARK_TABLE_ID }}
          LARK_ZHIXING_BASE_TOKEN: Vn7hbNMygaDrSMseVgycCCJen1e
          LARK_ZHIXING_TABLE_ID: ${{ secrets.LARK_ZHIXING_TABLE_ID }}
          LARK_CURATION_BASE_TOKEN: CtqgbzQHVazUyhsSiOEcIrxfnSd
          LARK_CURATION_TABLE_ID: ${{ secrets.LARK_CURATION_TABLE_ID }}
        run: python refresh.py

      - name: Mirror Feishu attachments to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          COS_MEDIA_PREFIX: ${{ vars.COS_MEDIA_PREFIX }}
          COS_SYNC_MODE: mirror
        run: python sync_feishu_media_to_cos.py

      - name: Commit stable COS data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add api/portfolio.json api/clients.json api/zhixing.json api/curation.json api/media-manifest.json reports/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: publish feishu media to tencent cos" && git push)

      - name: Deploy static website to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_PUBLIC_BASE_URL: ${{ secrets.COS_PUBLIC_BASE_URL }}
          COS_SITE_PREFIX: ${{ vars.COS_SITE_PREFIX }}
        run: python deploy_site_to_cos.py
