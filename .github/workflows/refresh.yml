name: Auto Refresh Feishu Portfolio

on:
  workflow_dispatch:

jobs:
  refresh-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Feishu refresh dependencies
        run: pip install requests boto3

      - name: Refresh portfolio data from Feishu
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ secrets.LARK_TABLE_ID }}
          LARK_ZHIXING_BASE_TOKEN: Vn7hbNMygaDrSMseVgycCCJen1e
          LARK_ZHIXING_TABLE_ID: ${{ secrets.LARK_ZHIXING_TABLE_ID }}
          LARK_CURATION_BASE_TOKEN: CtqgbzQHVazUyhsSiOEcIrxfnSd
          LARK_CURATION_TABLE_ID: ${{ secrets.LARK_CURATION_TABLE_ID }}
        run: python refresh.py

      - name: Reuse already mirrored Cloudflare R2 media
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_MEDIA_PREFIX: ${{ vars.R2_MEDIA_PREFIX }}
          R2_SYNC_MODE: reuse
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_PUBLIC_BASE_URL" ]; then
            echo "Skipping R2 media reuse because Cloudflare R2 secrets are incomplete."
            exit 0
          fi
          python sync_feishu_media_to_r2.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add api/portfolio.json api/clients.json api/zhixing.json api/curation.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto refresh feishu media" && git push)
