name: Auto Refresh Feishu Portfolio

on:
  push:
    branches:
      - main
    paths-ignore:
      - "api/portfolio.json"
      - "api/zhixing.json"
      - "api/curation.json"
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  refresh-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh portfolio data from Feishu
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ secrets.LARK_TABLE_ID }}
          LARK_ZHIXING_BASE_TOKEN: Vn7hbNMygaDrSMseVgycCCJen1e
          LARK_ZHIXING_TABLE_ID: ${{ secrets.LARK_ZHIXING_TABLE_ID }}
          LARK_CURATION_BASE_TOKEN: CtqgbzQHVazUyhsSiOEcIrxfnSd
          LARK_CURATION_TABLE_ID: ${{ secrets.LARK_CURATION_TABLE_ID }}
        run: python refresh.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add api/portfolio.json api/zhixing.json api/curation.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto refresh feishu media" && git push)
