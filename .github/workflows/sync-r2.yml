name: Sync Feishu Media to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      sync_scope:
        description: "What to mirror"
        required: true
        default: all
        type: choice
        options:
          - all
          - local_videos
      refresh_feishu_first:
        description: "Refresh Feishu data before mirroring media"
        required: true
        default: true
        type: boolean

jobs:
  sync-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests boto3

      - name: Refresh portfolio data from Feishu
        if: ${{ inputs.refresh_feishu_first }}
        timeout-minutes: 45
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ secrets.LARK_TABLE_ID }}
          LARK_ZHIXING_BASE_TOKEN: Vn7hbNMygaDrSMseVgycCCJen1e
          LARK_ZHIXING_TABLE_ID: ${{ secrets.LARK_ZHIXING_TABLE_ID }}
          LARK_CURATION_BASE_TOKEN: CtqgbzQHVazUyhsSiOEcIrxfnSd
          LARK_CURATION_TABLE_ID: ${{ secrets.LARK_CURATION_TABLE_ID }}
        run: python refresh.py

      - name: Mirror Feishu attachments to Cloudflare R2
        timeout-minutes: 45
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_MEDIA_PREFIX: ${{ vars.R2_MEDIA_PREFIX }}
          R2_LOCAL_MEDIA_PREFIX: ${{ vars.R2_LOCAL_MEDIA_PREFIX }}
          R2_SYNC_MODE: mirror
          R2_SYNC_SCOPE: ${{ inputs.sync_scope }}
        run: python sync_feishu_media_to_r2.py

      - name: Commit stable R2 URLs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add api/portfolio.json api/clients.json api/zhixing.json api/curation.json api/r2-media-manifest.json reports/*.json *.html *.css *.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: mirror feishu media to cloudflare r2" && git push)
