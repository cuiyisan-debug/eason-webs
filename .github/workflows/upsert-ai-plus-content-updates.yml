name: Upsert AI Plus Content Updates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upsert:
    runs-on: ubuntu-latest
    env:
      LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upsert AI++ records and fields
        run: python scripts/upsert_ai_plus_content_updates.py
