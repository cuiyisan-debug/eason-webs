name: Deploy Cloudflare Visitor Counter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/visitor-counter/**"
      - ".github/workflows/deploy-visitor-counter.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy visitor counter Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config workers/visitor-counter/wrangler.toml
