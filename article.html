<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html#top" aria-label="返回首页">
        <span class="brand-mark">E</span>
        <span>
          <strong>EASON.CUI</strong>
          <small>Spatial Experience Portfolio</small>
        </span>
      </a>
      <nav class="nav" aria-label="页面导航">
        <a href="./about.html">关于我</a>
        <a href="index.html#projects">项目</a>
        <a href="./curation.html" data-nav-curation>策展</a>
        <a href="./zhixing.html" data-nav-zhixing>知行</a>
        <a href="index.html#contact">联系</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="切换深色浅色" aria-pressed="false">
        <span class="theme-icon">◐</span>
      </button>
    </header>

    <main class="article-page">
      <section class="article-hero">
        <p class="eyebrow" data-article-label>ARTICLE</p>
        <h1 data-article-title>正在读取文章</h1>
        <p data-article-summary></p>
        <a class="source-link" data-article-source-link href="#" target="_blank" rel="noreferrer" hidden>查看原文链接 →</a>
      </section>

      <section class="article-story">
        <div class="zhixing-media article-media" data-article-media></div>
        <aside class="article-toc" data-article-toc hidden></aside>
        <div class="zhixing-body article-body" data-article-body></div>
      </section>

      <section class="related-projects article-related">
        <div class="section-head">
          <div>
            <p class="eyebrow">MORE NOTES</p>
            <h2>同类文章</h2>
          </div>
        </div>
        <div class="related-grid article-related-grid" data-related-articles></div>
      </section>

      <footer class="footer-line">
        <span>崔一三作品集</span>
        <span>mycys.top</span>
      </footer>
    </main>

    <dialog class="project-dialog article-image-dialog" data-article-image-dialog>
      <button class="icon-button dialog-close" type="button" aria-label="关闭图片浏览" data-article-image-close>×</button>
      <div class="dialog-gallery article-image-gallery">
        <button class="gallery-nav prev" type="button" aria-label="上一张" data-article-image-prev>←</button>
        <div class="dialog-media article-image-stage" data-article-image-stage></div>
        <button class="gallery-nav next" type="button" aria-label="下一张" data-article-image-next>→</button>
        <div class="gallery-thumbs article-image-thumbs" data-article-image-thumbs></div>
      </div>
    </dialog>

    <script src="./script.js?v=20260615-stats2"></script>
