<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
  <title id="title">崔一三艺术签名</title>
  <desc id="desc">橙色手写风格的崔一三签名，三个字位于同一行。</desc>
  <defs>
    <filter id="softInk" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.45" result="blur" />
      <feOffset dx="0" dy="0" result="offset" />
      <feMerge>
        <feMergeNode in="offset" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#ff6a00" stroke-linecap="round" stroke-linejoin="round" filter="url(#softInk)">
    <!-- 崔 -->
    <path d="M42 164 C78 152, 113 125, 150 83" stroke-width="21" />
    <path d="M96 118 C141 113, 189 95, 229 65" stroke-width="17" />
    <path d="M152 26 C144 58, 133 112, 116 202" stroke-width="19" />
    <path d="M177 46 C203 42, 225 50, 239 69" stroke-width="13" />
    <path d="M153 92 C183 85, 208 90, 228 105" stroke-width="12" />
    <path d="M143 128 C181 121, 219 123, 253 136" stroke-width="12" />
    <path d="M134 167 C174 160, 218 158, 265 167" stroke-width="13" />
    <path d="M202 95 C192 129, 187 155, 184 187" stroke-width="10" />
    <path d="M229 106 C222 130, 218 152, 214 177" stroke-width="9" />

    <!-- 一 -->
    <path d="M326 123 C390 113, 467 98, 545 86" stroke-width="20" />
    <path d="M311 128 C382 137, 474 126, 570 102" stroke-width="8" opacity="0.78" />

    <!-- 三 -->
    <path d="M609 62 C641 58, 675 57, 709 60" stroke-width="18" />
    <path d="M603 103 C640 99, 676 99, 716 105" stroke-width="17" />
    <path d="M592 156 C640 151, 690 150, 739 160" stroke-width="20" />
    <path d="M601 158 C633 176, 684 182, 746 173" stroke-width="9" opacity="0.86" />
  </g>
</svg>
